[workspace]
resolver = "2"

members = [
    "tcslog",
    "tcslog-c",
    "tcslog-gen",
]
# Built by cargo-fuzz on nightly, with flags the workspace does not want.
exclude = ["fuzz"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vomlehn/tcslog"

[workspace.dependencies]
libc = "0.2"
thiserror = "1.0"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Each argument in a doc comment's # Arguments list continues in its
# description's column, as the TCS projects' documentation rule has it,
# which is deeper than this lint's two spaces.
doc_overindented_list_items = "allow"
