[package]
name = "tcslog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Onboard telemetry logging into segment files, with recovery from lost or damaged segments"
build = "build.rs"

[features]
# Writing needs the build-time timer resolution; reading does not, so a
# read-only consumer can take the crate without supplying one.
default = ["write"]
write = []

[dependencies]
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Used only by examples/sample.rs, which cargo builds under the dev
# profile, so this stays out of a dependent's tree.
clap.workspace = true

[lints]
workspace = true
