# The Python 3 interface to tcslog: pure Python over ctypes, calling
# the libtcslog_c shared library. `make install` installs both, without
# pip; this file is for installing the package into a virtual
# environment instead, with
#
#     pip install ./tcslog-py
#
# where the library it loads is found as tcslog/__init__.py describes.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcslog"
version = "0.4.2"
description = "Python 3 interface to tcslog, a segmented telemetry log for storage-bounded systems"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"

[project.urls]
Repository = "https://github.com/vomlehn/tcslog"

[tool.setuptools]
packages = ["tcslog"]

[tool.setuptools.package-data]
# Marks the package as typed (PEP 561), so a type checker reads the
# annotations in tcslog/__init__.py rather than treating it as untyped.
tcslog = ["py.typed"]

# `make check` runs `ruff check`, `ruff format --check`, and
# `mypy --strict` over this directory, as it runs clippy and rustfmt
# over the crates.
[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "SIM", "UP", "D"]
ignore = [
    # The docstrings are this repository's prose, not pydocstyle's: a
    # summary may run past one line and need not end the line.
    "D200", "D205", "D209", "D212", "D213", "D400", "D401", "D415",
    # A class's docstring describes its constructor, and Python's own
    # documentation describes the dunder methods.
    "D105", "D107",
    # Exceptions name the variant; their docstrings describe it.
    "D203",
]

[tool.ruff.lint.per-file-ignores]
# Tests and examples are described by their module docstrings.
"tests/*" = ["D101", "D102", "D103", "D107"]
"examples/*" = ["D101", "D102", "D103", "D107"]

[tool.mypy]
strict = true
