# The Python 3 interface to tcslog: pure Python over ctypes, calling
# the libtcslog_c shared library that `make install` puts under PREFIX.
# Nothing here is compiled, so installing it is
#
#     pip install ./tcslog-py
#
# and the library it loads is found as tcslog/__init__.py describes.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcslog"
version = "0.4.0"
description = "Python 3 interface to tcslog, a segmented telemetry log for storage-bounded systems"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.8"

[project.urls]
Repository = "https://github.com/vomlehn/tcslog"

[tool.setuptools]
packages = ["tcslog"]
